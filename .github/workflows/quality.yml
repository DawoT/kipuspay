name: kipus-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: |
          pnpm lint
          pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios (umbrales de cobertura CAL-05)
        run: pnpm test:unit

      - name: Tests de integración
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Presupuesto de bundle del POS (CAL-06)
        working-directory: apps/pos-web
        run: pnpm bundle

      - name: Notificar fallo de CI (Quality)
        if: failure()
        env:
          CI_FAILURE_WEBHOOK_URL: ${{ secrets.CI_FAILURE_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CI_FAILURE_WEBHOOK_URL" ]; then
            echo "CI_FAILURE_WEBHOOK_URL no configurado, omitiendo notificación."
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "workflow": "${WORKFLOW_NAME}",
            "job": "${JOB_NAME}",
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "ref": "${REF_NAME}",
            "sha": "${SHA}",
            "actor": "${ACTOR}",
            "repository": "${REPOSITORY}",
            "event": "${EVENT_NAME}",
            "status": "failure",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          )
          curl -s -S -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$CI_FAILURE_WEBHOOK_URL" || true

  e2e-pos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: E2E POS (Playwright + Chrome del sistema)
        # El SW se bloquea por defecto en playwright.config (serviceWorkers: 'block')
        # para que los mocks page.route funcionen; los specs que prueban el SW lo
        # re-habilitan con test.use. Ubuntu-latest trae Chrome en /usr/bin.
        working-directory: apps/pos-web
        run: pnpm exec playwright test --reporter=list
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Subir trazas E2E (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/pos-web/test-results/
          if-no-files-found: ignore

      - name: Notificar fallo de CI (E2E POS)
        if: failure()
        env:
          CI_FAILURE_WEBHOOK_URL: ${{ secrets.CI_FAILURE_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CI_FAILURE_WEBHOOK_URL" ]; then
            echo "CI_FAILURE_WEBHOOK_URL no configurado, omitiendo notificación."
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "workflow": "${WORKFLOW_NAME}",
            "job": "${JOB_NAME}",
            "run_id": "${RUN_ID}",
            "run_attempt": "${RUN_ATTEMPT}",
            "ref": "${REF_NAME}",
            "sha": "${SHA}",
            "actor": "${ACTOR}",
            "repository": "${REPOSITORY}",
            "event": "${EVENT_NAME}",
            "status": "failure",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          )
          curl -s -S -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$CI_FAILURE_WEBHOOK_URL" || true
