<!doctype html>
<html lang="es-PE">
  <head>

    <meta name="theme-color" content="#14161c" />
    <title>KipusPay · Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #14161c;
        color: #f3efe6;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;

        width: min(32rem, calc(100% - 2rem));

        border: 1px solid rgba(243, 239, 230, 0.12);

      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        padding: 0 1rem;
        color: #14161c;
        background: #d99a3d;
        text-decoration: none;
        font-weight: 600;
      }

  <body>
    <main>
      <h1>Estás trabajando sin conexión</h1>
      <p>Las ventas guardadas en este dispositivo siguen en cola. Reintenta al recuperar la red.</p>
