<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>KipusPay · Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #0b0f19;
        color: #f8fafc;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid #475569;
        border-radius: 1rem;
        background: #111827;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        padding: 0 1rem;
        color: #fff;
        background: #4f46e5;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás trabajando sin conexión</h1>
      <p>Las ventas guardadas en este dispositivo siguen en cola. Reintenta al recuperar la red.</p>
      <a href="/">Volver al POS</a>
    </main>
  </body>
</html>
